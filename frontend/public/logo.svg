<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <!-- Deep MNNIT Collegiate Navy Gradient -->
    <linearGradient id="mnnitNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#163863" />
    </linearGradient>

    <!-- Warm Golden Amber Swoosh Gradient -->
    <linearGradient id="mnnitGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Accent Cyan Gradient (representing AI/Tech) -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Ambient Shadow for Vector Depth -->
    <filter id="vectorShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B2545" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B2545" flood-opacity="0.10" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Main Rounded Icon Container -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#mnnitNavy)" filter="url(#vectorShadow)" />
  <rect x="33.5" y="33.5" width="445" height="445" rx="102.5" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" />

  <!-- Background Orbit Arc (AI Connectivity Track) -->
  <path d="M 120 256 A 136 136 0 0 1 392 256" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3" stroke-dasharray="6 8" />
  
  <!-- Outer Interlocking "C" Arc (Campus) -->
  <path d="M 330 148 C 210 140, 130 205, 130 290 C 130 365, 205 408, 300 400" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.16)" 
        stroke-width="20" 
        stroke-linecap="round" />

  <!-- Vibrant Golden Swoosh Arc (MNNIT Signature Surge) -->
  <path d="M 108 340 
           C 170 415, 310 425, 404 336 
           C 418 322, 422 308, 408 304 
           C 392 300, 376 318, 350 334 
           C 278 376, 186 360, 126 318 Z" 
        fill="url(#mnnitGold)" 
        filter="url(#goldGlow)" />

  <!-- Center Piece: Modern Geometric Graduation Cap (Mortarboard) -->
  <!-- Top Rhombus Face -->
  <polygon points="256,140 395,200 256,260 117,200" 
           fill="#FFFFFF" />

  <!-- Subtle Cyan Tint Shading on Left Face -->
  <polygon points="256,140 117,200 256,260" 
           fill="url(#accentCyan)" 
           opacity="0.14" />

  <!-- Mortarboard Skullcap Lower Arch -->
  <path d="M 168,225 
           L 168,268 
           C 168,306, 344,306, 344,268 
           L 344,225 
           C 314,244, 285,250, 256,250 
           C 227,250, 198,244, 168,225 Z" 
        fill="#FFFFFF" />

  <!-- Cap Crown Button -->
  <circle cx="256" cy="200" r="9" fill="url(#mnnitGold)" />

  <!-- Golden Tassel Sweeping Gracefully to the Right -->
  <path d="M 256 200 
           Q 326 206, 358 244 
           Q 366 266, 364 298" 
        fill="none" 
        stroke="url(#mnnitGold)" 
        stroke-width="5" 
        stroke-linecap="round" />

  <!-- Tassel Fringe Pendant -->
  <rect x="357" y="296" width="14" height="22" rx="3.5" fill="url(#mnnitGold)" />
  <line x1="360" y1="318" x2="360" y2="330" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="364" y1="318" x2="364" y2="332" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="368" y1="318" x2="368" y2="330" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />

  <!-- AI Sparks (Four-pointed Star of Intelligence) -->
  <g transform="translate(400, 130)">
    <path d="M 0 -26 Q 0 0 26 0 Q 0 0 0 26 Q 0 0 -26 0 Q 0 0 0 -26 Z" 
          fill="url(#mnnitGold)" 
          filter="url(#goldGlow)" />
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Minor AI Spark (Lower Left) -->
  <g transform="translate(122, 268)">
    <path d="M 0 -15 Q 0 0 15 0 Q 0 0 0 15 Q 0 0 -15 0 Q 0 0 0 -15 Z" 
          fill="url(#mnnitGold)" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Connected AI Data Node (Electric Cyan) -->
  <circle cx="150" cy="155" r="5.5" fill="#38BDF8" />
  <line x1="150" y1="155" x2="185" y2="175" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3" opacity="0.7" />

  <!-- MNNIT Institutional Tagline Micro Inscription -->
  <text x="256" y="434" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#F8FAFC" letter-spacing="5">
    MNNIT
  </text>
</svg>
